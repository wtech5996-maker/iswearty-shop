<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISWEARTY SHOP</title>
<meta name="theme-color" content="#1a060c">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face { font-family: "Press Start 2P"; src: url("fonts/PressStart2P.woff") format("woff"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Onest"; src: url("fonts/Onest.woff") format("woff"); font-weight: 100 900; font-display: swap; }
:root {
  --night: #1a060c;
  --wine: #4a0f1f;
  --crimson: #e8193c;
  --crimson-deep: #8f0f26;
  --blush: #ff6f91;
  --sakura: #ffb8cb;
  --gold: #ffd36b;
  --ink: #fff2f5;
  --muted: rgba(255, 226, 233, 0.78);
  --faint: rgba(255, 226, 233, 0.52);
  --glass: linear-gradient(160deg, rgba(255, 236, 241, 0.14), rgba(255, 236, 241, 0.04));
  --glass-edge: rgba(255, 200, 215, 0.22);
  --pixel: "Press Start 2P", ui-monospace, monospace;
  --body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --spring: cubic-bezier(0.22, 1.28, 0.36, 1);
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  background: radial-gradient(120% 70% at 50% -10%, #7a1430 0%, var(--wine) 38%, var(--night) 78%) fixed, var(--night);
  color: var(--ink);
  font: 400 15px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
#petals { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: 12px 16px calc(28px + env(safe-area-inset-bottom)); min-height: 100vh; display: flex; flex-direction: column; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sakura); outline-offset: 3px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* glass surfaces */
.glass {
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  backdrop-filter: blur(18px) saturate(150%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 24px 48px -28px rgba(0, 0, 0, 0.7);
}

/* touch response: press in, spring back */
.tap { transition: transform 0.45s var(--spring), filter 0.2s, border-color 0.2s; }
.tap:active { transform: scale(0.965); transition-duration: 0.12s; transition-timing-function: var(--ease); filter: brightness(1.12); }

/* entrance: plates rise from the bottom one after another */
.rise { animation: rise 0.7s var(--spring) backwards; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes rise { from { opacity: 0; transform: translateY(36px) scale(0.97); } to { opacity: 1; transform: none; } }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.back { display: none; border: 0; width: 42px; height: 42px; border-radius: 14px; place-items: center; color: var(--ink); }
.back.on { display: grid; }
.brand { display: flex; align-items: center; gap: 8px; font: 400 10px/1 var(--pixel); color: var(--sakura); }
.brand svg { width: 18px; height: 18px; }
.lang { margin-left: auto; display: flex; padding: 3px; gap: 2px; border-radius: 999px; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--glass-edge); }
.lang button { border: 0; border-radius: 999px; background: transparent; padding: 7px 11px; font: 600 12px/1 var(--body); color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--crimson); color: #fff; }

/* hero */
.hero { padding: 26px 2px 22px; }
.logo { margin: 0; font: 400 clamp(28px, 9.2vw, 46px)/1.15 var(--pixel); letter-spacing: -0.02em; color: #fff; text-shadow: 3px 3px 0 var(--crimson), 6px 6px 0 var(--crimson-deep); }
.logo small { display: block; margin-top: 10px; font-size: 0.4em; color: var(--sakura); text-shadow: 2px 2px 0 var(--crimson-deep); }
.hero p { margin: 18px 0 0; max-width: 32ch; color: var(--muted); }
.boot .logo { animation: boot 900ms steps(8) both; }
.boot p { animation: rise 0.8s var(--spring) 0.5s both; }
@keyframes boot { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

/* home tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { position: relative; overflow: hidden; border-radius: 22px; padding: 16px; text-align: left; color: var(--ink); min-height: 132px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; isolation: isolate; }
.tile.wide { grid-column: span 2; min-height: 220px; border-radius: 26px; }
.tile.mid { grid-column: span 2; min-height: 104px; flex-direction: row; align-items: center; justify-content: flex-start; gap: 14px; }
.tile h3 { margin: 0; font: 800 22px/1.1 var(--body); letter-spacing: -0.01em; text-shadow: 2px 2px 0 var(--crimson-deep); }
.tile.wide h3 { font-size: 32px; }
.tile .sub { color: var(--muted); font-size: 13.5px; }
.badge { width: 46px; height: 46px; flex: none; border-radius: 15px; display: grid; place-items: center; color: var(--sakura); background: linear-gradient(160deg, rgba(232, 25, 60, 0.45), rgba(143, 15, 38, 0.35)); border: 1px solid rgba(255, 184, 203, 0.3); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2); }
.tile.small .badge { margin-bottom: auto; }
.from { font: 500 13.5px/1 var(--body); color: var(--sakura); display: inline-flex; align-items: center; gap: 6px; }
/* ---------- моушен-плашки: общая основа .fx ---------- */
/* тёмно-малиновый фон и два мягких пятна, которые плавают (размеры и путь — в процентах, подходит любой плашке) */
.fx { isolation: isolate; overflow: hidden; background: linear-gradient(160deg, #2a0811, #13040a); }
.fx .blob { position: absolute; z-index: -1; pointer-events: none; border-radius: 50%; width: 70%; aspect-ratio: 1; }
.fx .blob.b1 { left: -25%; top: -60%; background: radial-gradient(circle, rgba(232, 25, 60, 0.5), rgba(232, 25, 60, 0) 65%); animation: drift1 9s ease-in-out infinite alternate; }
.fx .blob.b2 { right: -25%; bottom: -60%; background: radial-gradient(circle, rgba(255, 111, 145, 0.34), rgba(255, 111, 145, 0) 65%); animation: drift2 11s ease-in-out infinite alternate; }
.choice.fx .blob, .tile.small.fx .blob { opacity: 0.75; }
.tile.small.fx .blob { width: 110%; }
.tile.small.fx .blob.b1 { animation-duration: 15s; } .tile.small.fx .blob.b2 { animation-duration: 18s; }
/* красная тень — только у крупных заголовков; на маленьких плитках она размывает буквы */
.tile.small h3 { text-shadow: none; }
.fx .badge { position: relative; }
@keyframes drift1 { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(45%, 15%) scale(1.15); } 100% { transform: translate(80%, 5%) scale(0.95); } }
@keyframes drift2 { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-40%, -15%) scale(1.2); } 100% { transform: translate(-70%, -3%) scale(1); } }

/* 1. Водянки: свечение, полоса света, лепестки, волна букв */
.tile.wide .glow { position: absolute; width: 230px; height: 230px; right: -60px; top: -90px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 184, 203, 0.35), rgba(232, 25, 60, 0) 65%); z-index: -1; pointer-events: none; animation: breathe 4.8s ease-in-out infinite; }
.tile.wide .sweep { position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(105deg, rgba(255, 236, 241, 0) 42%, rgba(255, 236, 241, 0.16) 50%, rgba(255, 236, 241, 0) 58%); transform: translateX(-100%); animation: sweep 4.5s var(--ease) infinite; }
.fx .fl { position: absolute; z-index: -1; pointer-events: none; bottom: -24px; left: var(--x); width: var(--s); height: calc(var(--s) * 0.65); border-radius: 50% 0 50% 0; background: linear-gradient(135deg, #ffb8cb, #ff6f91); opacity: 0; animation: petal-up var(--d) linear infinite; animation-delay: var(--w); }
.tile.wide .letters span { display: inline-block; animation: letter 2.6s ease-in-out infinite; animation-delay: calc(var(--i, 0) * 110ms); }
@keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.25); opacity: 1; } }
@keyframes sweep { 0% { transform: translateX(-100%); } 60%, 100% { transform: translateX(100%); } }
@keyframes petal-up { 0% { opacity: 0; transform: translate(0, 0) rotate(0deg); } 15% { opacity: 0.7; } 80% { opacity: 0.5; } 100% { opacity: 0; transform: translate(var(--dx), -250px) rotate(240deg); } }
@keyframes letter { 0%, 100% { transform: translateY(0) rotate(0deg); } 30% { transform: translateY(-10px) rotate(-3deg); } 60% { transform: translateY(2px) rotate(1deg); } }

/* 2 и 8. Приват: «шифр» — падают столбики пиксельных символов, ключ поворачивается, значок вспыхивает */
.tile.mid.priv { min-height: 150px; }
.tile.mid.priv h3 { font-size: 27px; }
.fx .cipher { position: absolute; z-index: -1; inset: 0 0 0 auto; width: 30%; overflow: hidden; pointer-events: none; }
.fx .cipher .col { position: absolute; top: 0; left: var(--x); font: 400 9px/1.35 var(--pixel); color: #ffb8cb; text-shadow: 0 0 6px rgba(255, 111, 145, 0.8); opacity: 0.38; transform: translateY(-110%); -webkit-mask-image: linear-gradient(180deg, transparent, #000 75%); mask-image: linear-gradient(180deg, transparent, #000 75%); animation: cipher var(--d) linear infinite; animation-delay: var(--w); }
.fx .cipher .col b { display: block; font-weight: 400; }
.fx .cipher .col b:last-child { color: #fff; }
.choice.fx .cipher .col { opacity: 0.25; }
/* в строках списка шифр только сверху справа — над ценой, не под ней */
.choice.fx .cipher { bottom: 58%; }
.tile.priv .from { position: relative; z-index: 1; padding: 6px 9px; border-radius: 12px; background: rgba(20, 5, 10, 0.6); }
.fx.keyfx .badge svg { animation: keyturn 5s ease-in-out infinite; }
.fx.keyfx .badge { animation: unlock 5s ease-in-out infinite; }
@keyframes cipher { from { transform: translateY(-110%); } to { transform: translateY(260px); } }
@keyframes keyturn { 0%, 70%, 100% { transform: rotate(0deg); } 78%, 90% { transform: rotate(-90deg); } }
@keyframes unlock { 0%, 74%, 100% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2); filter: none; } 80%, 88% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 0 24px rgba(255, 111, 145, 0.85); filter: brightness(1.3); } }
/* 8. Приват WM: надпись «WM» проступает, как водяной знак */
.fx .wmark { position: absolute; z-index: -1; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 400 46px/1 var(--pixel); color: #ffb8cb; opacity: 0; pointer-events: none; animation: wm-fade 4s ease-in-out infinite alternate; }
@keyframes wm-fade { 0% { opacity: 0; } 100% { opacity: 0.08; } }

/* 3. Озвучки: столбики эквалайзера, микрофон пульсирует */
.fx .eq { position: absolute; z-index: -1; top: 18px; right: 14px; width: 74px; height: 40px; display: flex; align-items: flex-end; gap: 4px; opacity: 0.7; pointer-events: none; }
.fx .eq i { flex: 1; height: 100%; border-radius: 3px; background: linear-gradient(0deg, #e8193c, #ffb8cb); transform-origin: bottom; transform: scaleY(0.2); animation: eq var(--d) ease-in-out infinite alternate; animation-delay: var(--w); }
.fx.voicefx .badge { animation: pulse 1.3s ease-out infinite; }
@keyframes eq { 0% { transform: scaleY(0.15); } 100% { transform: scaleY(1); } }
@keyframes pulse { 0% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 0 0 0 rgba(255, 111, 145, 0.55); } 100% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 0 0 12px rgba(255, 111, 145, 0); } }

/* 4. Аватарки: всплывают кружки-аватарки, смайлик подмигивает */
.fx .bub { position: absolute; z-index: -1; bottom: -24px; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%; border: 1.5px solid rgba(255, 184, 203, 0.7); background: radial-gradient(circle at 35% 35%, rgba(255, 184, 203, 0.45), rgba(232, 25, 60, 0.15)); opacity: 0; pointer-events: none; animation: bub-up var(--d) ease-in infinite; animation-delay: var(--w); }
.fx.avafx .badge svg { animation: wink 4.5s ease-in-out infinite; }
@keyframes bub-up { 0% { opacity: 0; transform: translateY(0) scale(0.6); } 20% { opacity: 0.75; } 85% { opacity: 0.5; } 100% { opacity: 0; transform: translateY(-190px) scale(1.1); } }
@keyframes wink { 0%, 84%, 100% { transform: none; } 88% { transform: scale(1.12, 0.7) rotate(-10deg); } 92% { transform: scale(1.05) rotate(4deg); } }

/* 5. Готовые: превью покачиваются веером */
.fx.readyfx .stackthumbs img:nth-child(1) { animation: fan1 4s ease-in-out infinite; }
.fx.readyfx .stackthumbs img:nth-child(2) { animation: fan2 4s ease-in-out infinite; }
.fx.readyfx .stackthumbs img:nth-child(3) { animation: fan3 4s ease-in-out infinite; }
@keyframes fan1 { 0%, 100% { transform: rotate(-8deg); } 50% { transform: translateX(-4px) rotate(-15deg); } }
@keyframes fan2 { 0%, 100% { transform: none; } 50% { transform: translateY(-4px); } }
@keyframes fan3 { 0%, 100% { transform: rotate(8deg); } 50% { transform: translateX(4px) rotate(15deg); } }

/* 6. Outro: полоса прогресса «конец ролика», play вспыхивает в конце */
.choice.outrofx { padding-bottom: 22px; }
.fx .prog { position: absolute; z-index: -1; left: 16px; right: 16px; bottom: 10px; height: 3px; border-radius: 3px; background: rgba(255, 236, 241, 0.12); overflow: hidden; pointer-events: none; }
.fx .prog i { position: absolute; inset: 0; background: linear-gradient(90deg, #e8193c, #ffb8cb); transform-origin: left; transform: scaleX(0); animation: progress 3.6s linear infinite; }
.fx.outrofx .badge { animation: flash 3.6s linear infinite; }
@keyframes progress { 0% { transform: scaleX(0); } 92%, 100% { transform: scaleX(1); } }
@keyframes flash { 0%, 88% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2); filter: none; } 94% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 0 22px rgba(255, 111, 145, 0.9); filter: brightness(1.35); } 100% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2); filter: none; } }

/* 7. Кастом: искры разлетаются от звёздочки, звёздочка вращается */
.fx .spark { position: absolute; z-index: -1; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: #ffd6e0; box-shadow: 0 0 6px #ff6f91; opacity: 0; pointer-events: none; animation: spark 1.8s ease-out infinite; animation-delay: var(--w); }
.fx.customfx .badge svg { animation: spin 9s linear infinite; }
@keyframes spark { 0% { opacity: 0; transform: translate(0, 0) scale(1); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0.3); } }
@keyframes spin { to { transform: rotate(360deg); } }

/* 9. Приват по эдитам: таймлайн — клипы едут, бегает линия воспроизведения */
.choice.editfx { padding-bottom: 34px; }
.fx .tl { position: absolute; z-index: -1; left: 0; right: 0; bottom: 0; height: 24px; overflow: hidden; pointer-events: none; background: rgba(0, 0, 0, 0.25); border-top: 1px solid rgba(255, 236, 241, 0.08); }
.fx .clips { position: absolute; left: 0; top: 6px; height: 12px; display: flex; gap: 4px; width: max-content; animation: clips 12s linear infinite; }
.fx .clips i { height: 100%; border-radius: 3px; background: linear-gradient(180deg, rgba(232, 25, 60, 0.75), rgba(143, 15, 38, 0.75)); border: 1px solid rgba(255, 184, 203, 0.35); }
.fx .clips i:nth-child(3n) { background: linear-gradient(180deg, rgba(255, 111, 145, 0.7), rgba(232, 25, 60, 0.6)); }
.fx .ph { position: absolute; inset: 0; animation: playhead 3.2s linear infinite; }
.fx .ph::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 6px #ff6f91; }
@keyframes clips { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes playhead { from { transform: translateX(4%); } to { transform: translateX(96%); } }

/* экономия трафика (класс calm у <html>) — плашки спокойные */
.calm .fx *, .calm .fx .badge svg, .calm .wave.playing .wv i { animation: none !important; }
.calm .fx .fl, .calm .fx .bub, .calm .fx .spark, .calm .fx .ph { display: none; }
/* наклон за курсором на всех плашках: JS задаёт --px и --py (от −0.5 до 0.5), блик — --mx и --my.
   --tilt — сила наклона: широким плашкам меньше, чтобы не было резко. */
.tile, .choice, .card, .line, .buy, .bonus { --tilt: 10deg; position: relative; transform: perspective(700px) rotateX(calc(var(--py, 0) * -1 * var(--tilt))) rotateY(calc(var(--px, 0) * var(--tilt))); transition: transform 0.4s var(--ease), filter 0.2s, border-color 0.25s, box-shadow 0.3s, background 0.2s; }
.choice { --tilt: 7deg; }
.card { --tilt: 12deg; }
.line { --tilt: 4deg; }
.buy, .cartbar { --tilt: 5deg; }
.tap:is(.tile, .choice, .card, .buy, .bonus):active { transform: perspective(700px) rotateX(calc(var(--py, 0) * -1 * var(--tilt))) rotateY(calc(var(--px, 0) * var(--tilt))) scale(0.965); transition-duration: 0.12s; }
.tile::after, .choice::after, .card::after, .line::after, .buy::after, .cartbar::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2; opacity: 0; transition: opacity 0.3s; background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255, 236, 241, 0.09), rgba(255, 236, 241, 0) 55%); }
.tile .badge, .choice .badge, .paylist .m { transition: scale 0.3s var(--spring), background 0.2s, border-color 0.2s; }
@media (hover: hover) {
  :is(.tile, .choice, .card, .line, .buy, .cartbar):hover::after { opacity: 1; }
  :is(.tile, .choice, .card, .line):hover { border-color: rgba(255, 184, 203, 0.35); box-shadow: 0 22px 44px -20px rgba(232, 25, 60, 0.6); }
  :is(.tile, .choice):hover .badge { scale: 1.08; }
  .paylist .m:hover { border-color: rgba(255, 184, 203, 0.45); background: rgba(232, 25, 60, 0.2); }
}

/* строка доверия под логотипом */
.trust { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 12px; font: 600 13.5px/1.2 var(--body); color: var(--muted); }
.trust .t { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; color: inherit; font: inherit; }
.trust button.t { color: var(--sakura); }
.trust svg { width: 16px; height: 16px; color: var(--sakura); }
/* метки «Новинка» и «Топ» на карточках */
.card .thumb .tag { position: absolute; z-index: 1; left: 8px; top: 8px; padding: 4px 8px; border-radius: 999px; font: 700 11px/1 var(--body); background: rgba(20, 5, 10, 0.74); border: 1px solid var(--glass-edge); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.card .thumb .tag.new { color: var(--sakura); }
.card .thumb .tag.hot { color: var(--gold); }
.card .thumb .tag + .tag { top: 33px; }
/* поиск по водянкам */
.search { margin: 0 0 12px; }
.search::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.card[hidden] { display: none; }
.nothing { padding: 22px 12px; text-align: center; color: var(--muted); }
/* «Как это работает» */
.how { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; counter-reset: how; }
.how li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; color: var(--muted); font-size: 13.5px; }
.how li::before { counter-increment: how; content: counter(how); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 400 10px/1 var(--pixel); color: var(--sakura); border: 1px solid var(--glass-edge); background: rgba(232, 25, 60, 0.14); }
/* одна цена для всех озвучек */
.voiceprice { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 4px 2px 12px; color: var(--muted); font-size: 14px; }
/* волна озвучки: светлая часть — уже прослушано */
.wave { position: relative; height: 24px; margin-top: 7px; }
.wave .wv { position: absolute; inset: 0; display: flex; align-items: center; gap: 2px; }
.wave .wv i { flex: 1; height: var(--h); border-radius: 2px; background: rgba(255, 226, 233, 0.2); transform-origin: center; }
.wave .wv.fill { clip-path: inset(0 calc(100% - var(--p, 0%)) 0 0); }
.wave .wv.fill i { background: linear-gradient(0deg, var(--blush), var(--sakura)); }
.wave.playing .wv i { animation: wv 0.8s ease-in-out infinite alternate; animation-delay: calc(var(--k) * -60ms); }
@keyframes wv { from { transform: scaleY(0.55); } to { transform: scaleY(1); } }
/* заставка загрузки */
.skel { border-radius: 22px; background: linear-gradient(90deg, rgba(255, 236, 241, 0.05) 25%, rgba(255, 236, 241, 0.11) 50%, rgba(255, 236, 241, 0.05) 75%) 0 0 / 200% 100%; animation: skel 1.3s linear infinite; }
@keyframes skel { to { background-position: -200% 0; } }

/* section heads */
.head { padding: 18px 2px 14px; }
.head h2 { margin: 0; font: 800 30px/1.1 var(--body); letter-spacing: -0.015em; text-shadow: 3px 3px 0 var(--crimson-deep); }
.head p { margin: 8px 0 0; color: var(--muted); max-width: 40ch; }

/* choice rows */
.choices { display: grid; gap: 12px; }
.choice { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; text-align: left; }
.choice h3 { margin: 0 0 2px; font: 800 19px/1.15 var(--body); }
.choice p { margin: 0; color: var(--muted); font-size: 13.5px; }
.stackthumbs { position: relative; width: 70px; height: 52px; }
.stackthumbs img { position: absolute; top: 0; width: 46px; height: 46px; border-radius: 12px; object-fit: cover; border: 1px solid rgba(255, 255, 255, 0.25); box-shadow: 0 8px 18px -8px rgba(0, 0, 0, 0.7); }
.stackthumbs img:nth-child(1) { left: 0; transform: rotate(-8deg); }
.stackthumbs img:nth-child(2) { left: 12px; top: 3px; }
.stackthumbs img:nth-child(3) { left: 24px; transform: rotate(8deg); }

/* price */
.price { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font: 400 13px/1 var(--pixel); color: #fff; }
.price .st { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.price .fiat { font: 800 15px/1 var(--body); white-space: nowrap; letter-spacing: -0.01em; }
.price .sep { font: 400 13px/1 var(--body); color: var(--faint); }
.price svg { width: 15px; height: 15px; }
.price.big { font-size: 18px; }
.price.big .fiat { font-size: 21px; }
.price.big svg { width: 20px; height: 20px; }
.price.sale { color: #ffd6e0; }
.price .old { opacity: .55; font: 600 13px/1 var(--body); }
.price .pct { font: 800 11.5px/1 var(--body); padding: 4px 6px; border-radius: 8px; background: var(--crimson); color: #fff; }
.star { fill: var(--gold); filter: drop-shadow(0 0 4px rgba(255, 211, 107, 0.45)); }
.paylist { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; color: var(--faint); font-size: 12px; }
.paylist .m svg { width: 14px; height: 14px; color: var(--sakura); }
.paylist .m { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 999px; background: rgba(255, 236, 241, 0.08); border: 1px solid var(--glass-edge); color: var(--ink); font-weight: 600; font-size: 12px; white-space: nowrap; }

/* cart */
.cartbtn { position: relative; border: 0; width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; color: var(--ink); margin-left: auto; }
.cartbtn + .lang { margin-left: 0; }
.cartbtn .count { position: absolute; top: -5px; right: -5px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: var(--crimson); color: #fff; font: 800 11px/19px var(--body); text-align: center; box-shadow: 0 0 0 2px var(--night); }
.cartbtn .count:empty { display: none; }
.cartbar { position: fixed; z-index: 4; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translate(-50%, 160%); width: min(488px, calc(100% - 32px)); border: 0; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 10px; color: #fff; background: linear-gradient(180deg, #ff3355, var(--crimson) 55%, #c4102f); box-shadow: 0 18px 36px -14px rgba(232, 25, 60, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.35); transition: transform 0.5s var(--spring); font: 800 15px/1.1 var(--body); }
.cartbar.on { transform: translate(-50%, 0) perspective(700px) rotateX(calc(var(--py, 0) * -1 * var(--tilt))) rotateY(calc(var(--px, 0) * var(--tilt))); }
.cartbar .sum { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
.cartbar .price { color: #fff; }
.cartbar .price .sep { color: rgba(255, 255, 255, 0.7); }
body.withbar .app { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
body.withbar .toast { bottom: calc(92px + env(safe-area-inset-bottom)); }
.lines { display: grid; gap: 10px; }
.line { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px; border-radius: 18px; }
.line .pic { position: relative; width: 56px; height: 56px; border-radius: 14px; overflow: hidden; background: #2b2b2b; }
.line .pic img, .line .pic .ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.line b { display: block; font: 700 15px/1.25 var(--body); }
.line small { display: block; color: var(--muted); font-size: 12.5px; margin: 2px 0 6px; word-break: break-word; }
.line .acts { display: grid; gap: 6px; justify-items: end; }
.iconbtn { border: 1px solid var(--glass-edge); background: rgba(255, 236, 241, 0.08); border-radius: 11px; padding: 7px 10px; font: 600 12.5px/1 var(--body); color: var(--ink); white-space: nowrap; }
.iconbtn.x { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; }
.total { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.total h4 { font: 800 19px/1.1 var(--body); }
.btnrow { display: grid; gap: 10px; }
.buy.ghost { background: rgba(255, 236, 241, 0.1); border: 1px solid var(--glass-edge); box-shadow: none; font-size: 15.5px; }
.buy:disabled { opacity: .55; cursor: not-allowed; }

/* watermark grid */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card { border-radius: 20px; overflow: hidden; padding: 0; text-align: left; display: flex; flex-direction: column; color: var(--ink); }
.card .thumb { position: relative; aspect-ratio: 1; background: #2b2b2b; }
.card .thumb video, .card .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.card .meta { padding: 10px 12px 12px; display: grid; gap: 6px; }
.card .meta b { font: 600 14.5px/1.2 var(--body); }
.ph { display: grid; place-items: center; background: linear-gradient(135deg, rgba(232, 25, 60, 0.3), rgba(74, 15, 31, 0.6)); }
.ph span { font: 400 18px/1 var(--pixel); color: var(--sakura); }

/* voices */
.voices { display: grid; gap: 10px; }
.voice { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: 20px; }
.play { width: 52px; height: 52px; border: 0; border-radius: 50%; background: var(--crimson); color: #fff; display: grid; place-items: center; box-shadow: 0 10px 22px -10px rgba(232, 25, 60, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
.play svg { width: 20px; height: 20px; fill: currentColor; stroke: none; }
.play:disabled { background: rgba(255, 236, 241, 0.1); box-shadow: none; cursor: not-allowed; }
.voice b { display: block; font-weight: 700; }
.bar { position: relative; height: 4px; margin-top: 9px; border-radius: 4px; background: rgba(255, 226, 233, 0.16); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 4px; background: linear-gradient(90deg, var(--blush), var(--sakura)); }
.voice .side { display: grid; gap: 8px; justify-items: end; }
.pick { border: 1px solid var(--glass-edge); border-radius: 12px; background: rgba(255, 236, 241, 0.1); padding: 8px 13px; font: 600 13px/1 var(--body); color: var(--ink); }

/* detail / form */
.panel { border-radius: 24px; padding: 18px; display: grid; gap: 16px; }
.panel h4 { margin: 0; font: 700 15px/1.3 var(--body); }
.features { margin: 0; padding: 0; list-style: none; display: grid; gap: 9px; }
.features li { position: relative; padding-left: 20px; }
.features li::before { content: ""; position: absolute; left: 2px; top: 0.55em; width: 8px; height: 8px; border-radius: 50%; background: var(--blush); box-shadow: 0 0 8px rgba(255, 111, 145, 0.7); }
.more { justify-self: start; border: 0; background: none; padding: 4px 0; color: var(--sakura); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--glass-edge); border-radius: 999px; background: rgba(255, 236, 241, 0.08); padding: 8px 12px; font-size: 13px; color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: rgba(232, 25, 60, 0.22); border: 1px solid rgba(232, 25, 60, 0.45); font-size: 12.5px; font-weight: 600; }
.note { color: var(--muted); font-size: 13.5px; margin: 0; }
.warn { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; padding: 11px 12px; border-radius: 14px; background: rgba(255, 211, 107, 0.1); border: 1px solid rgba(255, 211, 107, 0.35); color: #ffe6ad; font-size: 13.5px; }
.warn svg { width: 18px; height: 18px; margin-top: 1px; }
.field { display: grid; gap: 7px; }
.field label { font-weight: 600; font-size: 14px; }
.field .hint { display: flex; justify-content: space-between; gap: 12px; color: var(--faint); font-size: 12.5px; }
.input { width: 100%; padding: 13px 14px; border: 1px solid var(--glass-edge); background: rgba(0, 0, 0, 0.28); border-radius: 14px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
.input:focus { border-color: var(--sakura); box-shadow: 0 0 0 4px rgba(255, 184, 203, 0.12); }
textarea.input { min-height: 132px; resize: vertical; }
.err { color: #ffd0da; background: rgba(232, 25, 60, 0.22); border: 1px solid rgba(232, 25, 60, 0.5); padding: 10px 12px; border-radius: 12px; font-size: 13.5px; animation: shake 0.35s var(--ease); }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg button { border: 1px solid var(--glass-edge); background: rgba(0, 0, 0, 0.22); border-radius: 14px; padding: 10px 6px; display: grid; gap: 3px; text-align: center; }
.seg button b { font: 800 15px/1.2 var(--body); }
.seg button svg { width: 22px; height: 22px; margin: 0 auto 1px; color: var(--sakura); }
.seg button span { font-size: 11.5px; color: var(--faint); }
.seg button[aria-pressed="true"] { border-color: var(--crimson); background: rgba(232, 25, 60, 0.25); }
.seg button[aria-pressed="true"] span { color: var(--muted); }

/* buy button */
.pxf { font-family: var(--pixel); font-weight: 400; }
.buy { width: 100%; border: 0; border-radius: 18px; padding: 17px 16px; color: #fff; font: 800 17px/1 var(--body); display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(180deg, #ff3355, var(--crimson) 55%, #c4102f); box-shadow: 0 16px 30px -14px rgba(232, 25, 60, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
.buy .pxf { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.buy svg { width: 16px; height: 16px; }

/* bottom sheet for ready-made watermarks */
.scrim { position: fixed; inset: 0; z-index: 5; background: rgba(10, 2, 5, 0.6); opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 6; left: 50%; bottom: 0; width: min(520px, 100%); max-height: 92vh; overflow-y: auto; transform: translate(-50%, 104%); transition: transform 0.55s var(--spring); border-radius: 28px 28px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(74, 15, 31, 0.94), rgba(26, 6, 12, 0.97)); border: 1px solid var(--glass-edge); border-bottom: 0; -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); }
.sheet.on { transform: translate(-50%, 0); }
.grab { width: 44px; height: 5px; margin: 0 auto 12px; border-radius: 5px; background: rgba(255, 226, 233, 0.3); }
.sheet .video { aspect-ratio: 1; max-height: 46vh; margin: 0 auto; border-radius: 18px; overflow: hidden; background: #2b2b2b; position: relative; }
.sheet .video video, .sheet .video img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.sheet h3 { margin: 14px 0 4px; font: 800 26px/1.1 var(--body); text-shadow: 2px 2px 0 var(--crimson-deep); }
.sheet .row { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.sheet .stack { display: grid; gap: 16px; margin-top: 14px; }
.sheet .stack > * { animation: rise 0.6s var(--spring) both; }
.sheet .stack > *:nth-child(2) { animation-delay: 60ms; } .sheet .stack > *:nth-child(3) { animation-delay: 120ms; } .sheet .stack > *:nth-child(n+4) { animation-delay: 180ms; }

.legal { margin-top: auto; padding-top: 28px; color: var(--faint); font-size: 12.5px; text-align: center; }
.toast { position: fixed; z-index: 9; left: 50%; bottom: 24px; transform: translate(-50%, calc(100% + 40px)); visibility: hidden; width: min(480px, calc(100% - 32px)); padding: 12px 14px; border-radius: 14px; background: rgba(26, 6, 12, 0.94); border: 1px solid var(--glass-edge); font-size: 13.5px; transition: transform 0.4s var(--spring); white-space: pre-wrap; word-break: break-word; }
.toast.on { transform: translate(-50%, 0); visibility: visible; }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); border-radius: 20px; }

@media (prefers-reduced-motion: reduce) {
  .rise, .boot .logo, .boot p, .sheet .stack > *, .err { animation: none; }
  .fx *, .fx .badge svg, .wave.playing .wv i, .skel { animation: none !important; }
  .fx .fl, .fx .bub, .fx .spark, .fx .ph { display: none; }
  .sheet, .scrim, .toast, .tap, .tile, .choice, .card, .line, .buy, .tile .badge, .choice .badge, .paylist .m { transition: none; }
  .tile, .choice, .card, .line, .buy, .bonus, .tap:is(.tile, .choice, .card, .buy, .bonus):active { transform: none; }
}
  /* «Мои водянки» и нижняя панель */
  #view { padding-bottom: 110px; }
  .dock[hidden] { display: none; }
  .dock { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); transform: translateX(-50%); display: grid; grid-template-columns: repeat(3, 1fr); width: min(380px, calc(100% - 32px)); padding: 6px; border-radius: 999px; z-index: 20; background: rgba(18, 18, 22, .82); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
  .dock .pill { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 3); border-radius: 999px; background: rgba(255, 255, 255, .22); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25); transition: transform .5s cubic-bezier(.2, .8, .2, 1); }
  .dock .pill.bump { animation: pillBump .5s cubic-bezier(.2, .8, .2, 1); }

  .dock button[aria-current="true"] { opacity: 1; }
  .dock button:focus, .dock button:focus-visible { outline: none; }

  .dock svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .titleline { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; }
  .favbtn { flex: none; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .06); color: #fff; cursor: pointer; transition: transform .2s, background .2s; }
  .favbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .favbtn[aria-pressed="true"] { color: #ff4d6d; background: rgba(255, 77, 109, .14); border-color: rgba(255, 77, 109, .4); }

  /* 3D-водянка на экране загрузки */
  @keyframes floaty { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
  .splash { display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 48px; text-align: center; }
  .splash3d { width: min(320px, 84vw); height: auto; animation: floaty 4.2s ease-in-out infinite; }
  .splash-bar { width: 180px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .12); overflow: hidden; }
  .splash-bar span { display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #ffb8cb, #ff4d6d); animation: splashBar 1.2s ease-in-out infinite; }
  @keyframes splashBar { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  .splash-text { margin: 0; font-size: 14px; opacity: .8; }
  @media (prefers-reduced-motion: reduce) { .splash3d, .splash-bar span { animation: none; } }
  /* ===== Пиксельный бонус: плашка, автомат, переход, сообщение ===== */
  .bonus { --tilt: 9deg; --ink: #3a0b1c; overflow: hidden; display: flex; align-items: center; gap: 14px; width: 100%; margin-top: 14px; padding: 14px 14px 14px 12px; border: 0; border-radius: 20px; cursor: pointer; text-align: left; color: #fff; font: inherit;
    background: repeating-conic-gradient(rgba(0, 0, 0, .13) 0 25%, transparent 0 50%) 0 0 / 4px 4px, linear-gradient(115deg, #d93a62 0, #b81e45 45%, #8a1535 100%);
    box-shadow: 0 0 0 3px var(--ink), 0 0 0 5px rgba(255, 184, 203, .35), 0 16px 30px -10px rgba(255, 61, 99, .7), inset 0 3px 0 rgba(255, 255, 255, .28), inset 0 -4px 0 rgba(58, 11, 28, .35); }
  .bonus::before { content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 28%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .35), transparent); transform: skewX(-20deg); animation: bnShine 3.2s cubic-bezier(.4, 0, .2, 1) infinite; pointer-events: none; }
  .bonus::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(160px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, .26), transparent 60%); opacity: 0; transition: opacity .2s; }
  .bonus:hover::after { opacity: 1; }
  @keyframes bnShine { 0%, 55% { left: -40%; } 100% { left: 130%; } }
  .bn-gift { position: relative; flex: none; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 14px; background: rgba(58, 11, 28, .45); box-shadow: inset 0 0 0 2px rgba(58, 11, 28, .6); }
  .bn-gift svg { width: 40px; height: 40px; shape-rendering: crispEdges; overflow: visible; }
  .bn-lid { animation: bnLid 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes bnLid { 0%, 70%, 100% { transform: translateY(0); } 74% { transform: translateY(-3px); } 78% { transform: translateY(-5px) rotate(-6deg); } 84% { transform: translateY(-2px); } 88% { transform: translateY(0); } }
  .bn-gift i { position: absolute; width: 4px; height: 4px; background: #fff; opacity: 0; animation: bnSpk 2.4s ease-out infinite; }
  .bn-gift i:nth-of-type(1) { left: 6px; top: 8px; } .bn-gift i:nth-of-type(2) { right: 5px; top: 5px; animation-delay: .15s; } .bn-gift i:nth-of-type(3) { right: 8px; bottom: 10px; animation-delay: .3s; }
  @keyframes bnSpk { 0%, 72% { opacity: 0; transform: scale(1); } 78% { opacity: 1; transform: scale(1.6); } 90%, 100% { opacity: 0; } }
  .bn-text { flex: 1; min-width: 0; position: relative; }
  .bn-eyebrow { display: inline-block; font: 400 8px/1 var(--pixel); letter-spacing: .06em; color: #3a0b1c; background: #fff0f4; padding: 4px 5px 3px; border-radius: 4px; margin-bottom: 7px; }
  .bn-text b { display: block; font: 800 19px/1.15 var(--body); color: #fff; text-shadow: 0 2px 6px rgba(40, 4, 16, .55); }
  .bn-text small { display: block; margin-top: 5px; font: 600 12.5px/1.35 var(--body); color: rgba(255, 255, 255, .92); text-shadow: 0 1px 3px rgba(40, 4, 16, .5); }
  .bn-badge { flex: none; position: relative; display: grid; place-items: center; gap: 4px; padding: 8px 8px 7px; border-radius: 10px; background: #3a0b1c; box-shadow: inset 0 0 0 2px #ff8fab; }
  .bn-badge span { font: 400 7px/1 var(--pixel); color: #ffb8cb; }
  .bn-badge strong { font: 400 13px/1 var(--pixel); color: #fff; text-shadow: 2px 2px 0 #b81e45; animation: bnBlink 1.6s ease-in-out infinite; }
  @keyframes bnBlink { 50% { color: #ffb8cb; } }
  /* окно автомата */
  .bn-ov { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); background: repeating-conic-gradient(rgba(255, 255, 255, .025) 0 25%, transparent 0 50%) 0 0 / 8px 8px, #12040a; color: #fff0f4; }

  @keyframes bnQuake { 15% { transform: translate(-6px, 3px); } 30% { transform: translate(6px, -4px); } 45% { transform: translate(-4px, 2px); } 60% { transform: translate(3px, -2px); } 80% { transform: translate(-1px, 1px); } 100% { transform: none; } }
  .bn-top { position: absolute; top: calc(14px + env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; justify-content: space-between; }

  // наклон плашек за курсором (только на устройствах с мышью и без «уменьшить движение»)
  const TILT = ".tile, .choice, .card, .line, .buy, .cartbar, .bonus";
  if (matchMedia("(hover: hover)").matches && !reduceMotion) {
    document.addEventListener("pointermove", (e) => {
      const el = e.target.closest ? e.target.closest(TILT) : null;
      if (!el) return;
      const r = el.getBoundingClientRect();
      if (!r.width || !r.height) return;
      const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      const y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
      el.style.setProperty("--px", (x - 0.5).toFixed(3));
      el.style.setProperty("--py", (y - 0.5).toFixed(3));
      el.style.setProperty("--mx", `${(x * 100).toFixed(1)}%`);
      el.style.setProperty("--my", `${(y * 100).toFixed(1)}%`);
    });
    document.addEventListener("pointerout", (e) => {
      const el = e.target.closest ? e.target.closest(TILT) : null;
      if (el && !el.contains(e.relatedTarget)) {
        el.style.removeProperty("--px");
        el.style.removeProperty("--py");
      }
    });
  }

  // play previews only while visible
  let io;
  function observeVideos() {
    io && io.disconnect();
    if (lite) return;
    io = new IntersectionObserver((entries) => entries.forEach((e) => { const v = e.target; if (e.isIntersecting) v.play().catch(() => {}); else v.pause(); }), { threshold: 0.35 });
    document.querySelectorAll("#view .card video").forEach((v) => io.observe(v));
  }

  // ---------- audio samples ----------
  let audio = null, audioCode = null, raf = 0;
  function stopAudio() {
    if (audio) { audio.pause(); audio = null; }
    cancelAnimationFrame(raf);
    document.querySelectorAll("[data-play]").forEach((b) => (b.innerHTML = ICON.play));
    document.querySelectorAll("[data-bar]").forEach((i) => i.style.setProperty("--p", "0%"));
    document.querySelectorAll(".wave.playing").forEach((w) => w.classList.remove("playing"));
    audioCode = null;
  }
  function togglePlay(code) {
    if (audioCode === code) return stopAudio();
    stopAudio();
    const item = byCode(code);
    if (!item.audio) return;

  const bnSfx = (() => {
    let ctx = null, out = null, on = true;

    const cell = Math.ceil(Math.max(innerWidth, innerHeight) / 16);
    c.width = innerWidth; c.height = innerHeight; c.hidden = false;

    // экран «загрузки» автомата
    const go = $("#bnGo"), boot = $("#bnBoot"), title = $("#bnTitle"), sub = $("#bnSub"), m = $("#bnM");
    title.textContent = ""; boot.hidden = false; boot.textContent = ""; go.disabled = true; go.classList.remove("pulse"); sub.textContent = t("bonusLoad");
    $("#bnX").disabled = true;
    await bnWipe(false);
    m.classList.remove("drop"); void m.offsetWidth; m.classList.add("drop");
    setTimeout(() => { bnSfx.land(); haptic("medium"); }, reduceMotion ? 0 : 420);
    await bnSleep(reduceMotion ? 0 : 650);
    for (const ch of "ISWEARTY") { title.textContent += ch; bnSfx.type(); await bnSleep(reduceMotion ? 0 : 55); }
    for (let p = 0; p <= 10; p++) { boot.innerHTML = `LOAD BONUS<br>[${"#".repeat(p)}${".".repeat(10 - p)}]`; if (p) bnSfx.load(p); await bnSleep(reduceMotion ? 0 : 45); }
    boot.hidden = true;
    if (!reduceMotion) {
      bnSfx.ticks(10, 550, 1100); bnSfx.ticks(10, 750, 1350);
      reels.forEach((r, i) => { const s0 = 10 + r.cur; bnPlace(r, s0, 0); void r.st.offsetHeight; bnPlace(r, s0 + 10, 550 + i * 200, "cubic-bezier(.3,0,.2,1)"); });
      await bnSleep(780);
      reels.forEach((r) => bnPlace(r, 10 + r.cur, 0));
    }
    bnSfx.ready();
    sub.textContent = t("bonusPress");
    go.disabled = false; go.classList.add("pulse"); $("#bnX").disabled = false;
    bnBusy = false;
  }

  function bnBurst() {
    if (reduceMotion) return;
    const fx = $("#bnFx"), r = $("#bnM").getBoundingClientRect();
    const cols = ["#ff3d63", "#ffb8cb", "#fff0f4", "#ff6f91", "#b81e45"];
    for (let i = 0; i < 50; i++) {
      const p = document.createElement("i");
      p.style.background = cols[i % 5];
      const x0 = r.left + r.width / 2, y0 = r.top + r.height * 0.45, a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 200;
      p.style.left = x0 + "px"; p.style.top = y0 + "px";
      fx.appendChild(p);
      p.animate([{ transform: "translate(0,0)", opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d + 170}px)`, opacity: 0 }],
        { duration: 1400 + Math.random() * 900, easing: "cubic-bezier(.15,.7,.3,1)" }).onfinish = () => p.remove();
    }
  }

  /** Крутим: сразу удар, тряска и разгон барабанов; результат берём с сервера и останавливаемся на нём. */
  async function bnSpin() {
    if (bnBusy) return;
    bnBusy = true;
    const go = $("#bnGo"), m = $("#bnM"), ov = $("#bnOv"), sub = $("#bnSub"), res = $("#bnRes");
    const reels = bnInitReels();
    go.disabled = true; go.classList.remove("pulse"); $("#bnX").disabled = true;
    m.classList.remove("win", "drop", "shake"); void m.offsetWidth; m.classList.add("spin", "shake");
    setTimeout(() => m.classList.remove("shake"), 620);
    if (!reduceMotion) {
      ov.classList.remove("quake"); void ov.offsetWidth; ov.classList.add("quake");
      const fl = $("#bnFlash"); fl.classList.remove("on"); void fl.offsetWidth; fl.classList.add("on");
    }
    haptic("heavy"); bnSfx.clunk();
    sub.textContent = t("bonusLuck"); res.textContent = t("bonusSpinning");
    // разгон, пока ждём ответ сервера
    reels.forEach((r) => { const s0 = 10 + r.cur; bnPlace(r, s0, 0); void r.st.offsetHeight; if (!reduceMotion) bnPlace(r, s0 + 60, 6000, "cubic-bezier(.5,0,1,1)"); });
    const tick = reduceMotion ? null : setInterval(() => bnSfx.tick(1100 + Math.random() * 250), 70);
    let d = null, failed = false;
    const started = Date.now();
    try {
      const r = await fetch(`${API_BASE}/api/buyer/bonus`, { method: "POST", headers: { "content-type": "application/json" }, body: authBody({ action: "spin" }) });
      d = await r.json();
    } catch { failed = true; }
    if (!reduceMotion) await bnSleep(Math.max(0, 450 - (Date.now() - started)));
    if (tick) clearInterval(tick);
    const ok = !failed && d && d.ok;
    const v = ok && d.percent ? Number(d.percent) : null;
    const dig = v ? [Math.floor(v / 10), v % 10] : [0, 0];
    const T = reduceMotion ? [0, 0] : [2000, 3000];
    reels.forEach((r, i) => {
      const now = bnNow(r);
      bnPlace(r, now, 0); void r.st.offsetHeight;
      const base = Math.ceil(now), digNow = ((base % 10) + 10) % 10;
      const end = base + 10 * (2 + i * 2) + ((dig[i] - digNow + 10) % 10);
      bnPlace(r, end, T[i]);
      bnSfx.ticks(Math.min(end - base, 40), T[i] || 1, i ? 1350 : 1100);
      bnSfx.stop((T[i] || 0) / 1000);
      r.cur = dig[i];
      // после остановки «переносим» барабан к началу ленты, чтобы следующий раз было куда крутить
      setTimeout(() => bnPlace(r, 10 + r.cur, 0), (T[i] || 0) + 60);
    });
    await bnSleep((T[1] || 0) + 250);
    m.classList.remove("spin");
    if (!ok) {
      sub.textContent = t("bonusPress"); res.textContent = t("bonusErr");
      go.disabled = false; go.classList.add("pulse"); $("#bnX").disabled = false; bnBusy = false;
      return;
    }
    if (!v) {
      // крутить пока нельзя: закрываем автомат, плашку убираем
      bnSfx.lose(); haptic("light");
      sub.textContent = t("bonusLockTag");
      res.textContent = t("bonusLocked");
      bnResult = { locked: true };
    } else {
      m.classList.add("win"); bnBurst(); bnSfx.win(v >= 36); haptic("heavy");
      const bang = $("#bnBang"); bang.textContent = v >= 36 ? "JACKPOT!" : "BONUS!"; bang.classList.remove("on"); void bang.offsetWidth; bang.classList.add("on");
      sub.textContent = t("bonusWinTag");
      res.innerHTML = `<b>${esc(t("bonusResult").replace("{p}", v))}</b>${esc(t("bonusUntil").replace("{d}", ddmm(d.until)))}`;
      bnResult = { percent: v, until: d.until };
      bonusActive = { percent: v, until: d.until };
      personalize();
    }
    bonusGone = true;
    await bnSleep(reduceMotion ? 0 : 1500);
    m.classList.remove("win");
    bnSetGo(v ? t("bonusClaim") : t("bonusCloseBtn"), bnClose);
    go.disabled = false; $("#bnX").disabled = false;
    bnBusy = false;
  }

  async function bnClose() {
    if (!bnIsOpen() || bnBusy) return;
    bnBusy = true;
    bnSfx.back();
    await bnWipe(true);
    $("#bnOv").hidden = true;
    document.body.style.overflow = "";
    if (inTelegram && stack.length === 1) { try { tg.BackButton.hide(); } catch {} }
    if (bnResult) render();
    await bnWipe(false);
    if (bnResult && bnResult.percent) { bonusNote(t("bonusWon").replace("{p}", bnResult.percent).replace("{d}", ddmm(bnResult.until))); setTimeout(() => bnSfx.pop(), 150); }
    else if (bnResult && bnResult.locked) bonusNote(t("bonusLocked"));
    bnResult = null;
    bnBusy = false; bonusBusy = false;
  }

  $("#bnX")?.addEventListener("click", () => bnClose());
  $("#bnSnd")?.addEventListener("click", () => {
    const v = bnSfx.toggle();
    $("#bnSnd").setAttribute("aria-pressed", String(v));
    $("#bnSnd").lastChild.textContent = v ? "ON" : "OFF";
  });
  // рычаг: потянуть вниз или просто нажать
  (() => {
    const lever = $("#bnLever");
    if (!lever) return;
    let ly = null;
    const canPull = () => !bnBusy && $("#bnGo").onclick === bnSpin && !$("#bnGo").disabled;
    lever.addEventListener("pointerdown", (e) => { if (!canPull()) return; ly = e.clientY; lever.classList.add("drag"); try { lever.setPointerCapture(e.pointerId); } catch {} });
    lever.addEventListener("pointermove", (e) => { if (ly === null) return; const dd = Math.max(0, Math.min(110, e.clientY - ly)); lever.style.setProperty("--pull", (1 - (dd / 110) * 1.55).toFixed(3)); });
    const end = (e, cancel) => { if (ly === null) return; const dd = e.clientY - ly; ly = null; lever.classList.remove("drag"); lever.style.removeProperty("--pull"); if (!cancel && (dd > 35 || dd < 5)) bnSpin(); };
    lever.addEventListener("pointerup", (e) => end(e, false));
    lever.addEventListener("pointercancel", (e) => end(e, true));
  })();
  // 3D-наклон автомата за пальцем или мышью
  (() => {
    const sc = $("#bnScene"), tl = $("#bnTilt");
    if (!sc || !tl || reduceMotion) return;
    sc.addEventListener("pointermove", (e) => {
      const r = sc.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      tl.style.setProperty("--ry", ((px - 0.5) * 16).toFixed(2) + "deg");
      tl.style.setProperty("--rx", ((0.5 - py) * 12).toFixed(2) + "deg");
    });
    sc.addEventListener("pointerleave", () => { tl.style.removeProperty("--rx"); tl.style.removeProperty("--ry"); });
  })();
  $("#bonusNoteX")?.addEventListener("click", () => { bnSfx.back(); $("#bonusNote")?.classList.remove("on"); });

  function toggleFav(code) {
    const was = favs.includes(code);
    favs = was ? favs.filter((c) => c !== code) : [code, ...favs];
    syncFav(code);
    haptic(was ? "light" : "medium");
    fetch(`${API_BASE}/api/buyer/favorites`, { method: "POST", headers: { "content-type": "application/json" }, body: authBody({ action: was ? "remove" : "add", code }) })
      .then((r) => r.json())
      .then((d) => { if (!d || !d.ok) throw new Error((d && d.error) || "error"); favs = d.favorites; syncFav(code); })
      .catch(() => { favs = was ? [code, ...favs.filter((c) => c !== code)] : favs.filter((c) => c !== code); syncFav(code); toast(t("favErr")); });
  }
  /** Обновить сердечко в открытой карточке и экран «Избранное». */
  function syncFav(code) {
    const b = document.querySelector(`.favbtn[data-fav="${CSS.escape(code)}"]`);
    if (b) b.setAttribute("aria-pressed", String(favs.includes(code)));
    if (stack[stack.length - 1].screen === "fav" || !sheetOpen) render();
  }
  function loadBonusStatus() {
    if (!featuresState || !canAuth()) return Promise.resolve();
    return fetch(`${API_BASE}/api/buyer/bonus`, { method: "POST", headers: { "content-type": "application/json" }, body: authBody({ action: "status" }) })
      .then((r) => r.json())
      .then((d) => {
        if (!d || !d.ok) return;
        bonusState = d;
        bonusActive = d.percent && d.until ? { percent: d.percent, until: d.until } : null;
        personalize();
      })
      .catch(() => {});
  }
  function loadFeatures() {
    if (featuresState !== null || !canAuth()) return Promise.resolve();
    featuresState = false;
    return fetch(`${API_BASE}/api/buyer/config`, { method: "POST", headers: { "content-type": "application/json" }, body: authBody() })
      .then((r) => r.json())
      .then((d) => {
        if (!d || !d.ok) return;
        featuresState = Boolean(d.nav);
        if (Array.isArray(d.favorites)) favs = d.favorites;
        if (d.stars) starsState = d.stars;
        if (featuresState) { return loadBonusStatus().then(() => render()); }
        render();
        const dock = $("#dock");
        if (dock) dock.hidden = !featuresState;
      })
      .then(() => { const dock = $("#dock"); if (dock && featuresState) dock.hidden = false; })
      .catch(() => {});
  }
  function updateDock() {
    const dock = $("#dock");
    if (!dock) return;
    loadFeatures();
    const active = stack[0] && ["mine", "fav"].includes(stack[0].screen) ? stack[0].screen : "home";
    const prevActive = dock.dataset.active;
    dock.dataset.active = active;
    document.body.classList.toggle("has-dock", !dock.hidden);
    if (prevActive && prevActive !== active) {
      const pill = dock.querySelector(".pill");
      if (pill) { pill.classList.remove("bump"); void pill.offsetWidth; pill.classList.add("bump"); }
    }
    dock.querySelectorAll("button[data-tab]").forEach((b) => b.setAttribute("aria-current", String(b.dataset.tab === active)));
    const shopL = $("#navShopLabel"), mineL = $("#navMineLabel");
    if (shopL) shopL.textContent = t("navShop");
    if (mineL) mineL.textContent = t("navMine");
    const favL = $("#navFavLabel");
    if (favL) favL.textContent = t("navFav");
  }
  function mineStepsHtml(o) {
    if (o.stage === "refunded" || o.stage === "attention" || String(o.stage).startsWith("stars_")) return `<p class="mine-note">${esc(o.stage_text)}</p>`;
    const cur = o.stage === "ready" ? 2 : 1;
    const names = [t("stPaid"), t("stWork"), t("stReady")];
    return `<div class="mine-steps">${names.map((s, i) => `<span class="${i <= cur ? "on" : ""}${i === cur ? " now" : ""}">${esc(s)}</span>`).join("")}</div>`;
  }
  function mineListHtml() {
    if (mineState.status === "outside") return `<p class="mine-empty">${esc(t("mineOutside"))}</p>`;
    if (mineState.status === "error") return `<p class="mine-empty">${esc(t("mineError"))}</p>`;
    if (mineState.status !== "ok") return `<p class="mine-empty">${esc(t("mineLoading"))}</p>`;
    if (!mineState.orders.length) return `<p class="mine-empty">${esc(t("mineEmpty"))}</p>`;
    return mineState.orders.map((o) => `<article class="mine-item glass"><div class="mine-head"><b>${o.no ? `${esc(o.no)} · ` : ""}${esc(o.title)}</b></div>${mineStepsHtml(o)}${o.ready ? `<p class="mine-note">${esc(t("mineReady"))}</p>` : ""}</article>`).join("");
  }
  function paintMine() {
    const el = $("#mine-list");
    if (el) el.innerHTML = mineListHtml();
  }
  async function loadMine() {
    if (!canAuth()) { mineState = { status: "outside", orders: [] }; return paintMine(); }
    if (mineState.status === "loading") return;
    mineState = { status: "loading", orders: mineState.orders };
    paintMine();
    try {
      const res = await fetch(`${API_BASE}/api/buyer/orders`, { method: "POST", headers: { "content-type": "application/json" }, body: authBody({ lang }) });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || "error");
      mineState = { status: "ok", orders: data.orders };
    } catch {
      mineState = { status: "error", orders: [] };
    }
    paintMine();
  }

  // ---------- events ----------
  document.addEventListener("click", (e) => {
    const el = e.target.closest("button, [data-go]");
    if (!el) return;
    if (el.dataset.lang) { if (el.dataset.lang === lang) return; lang = el.dataset.lang; try { localStorage.setItem("isw-lang", lang); } catch {} closeSheet(); render(); return; }
    if (el.id === "back") return back();
    if (el.dataset.tab) return switchTab(el.dataset.tab);
    if (el.dataset.fav) return toggleFav(el.dataset.fav);
    if (el.dataset.bonus) return bnOpen();
    if (el.dataset.go === "cart" && stack[stack.length - 1].screen === "cart") return;
    if (el.dataset.go) { closeSheet(); return go(el.dataset.go, { code: el.dataset.code }); }
    if (el.dataset.sheet) return openSheet(el.dataset.sheet);
    if (el.dataset.play) return togglePlay(el.dataset.play);
    if (el.dataset.all) { stack[stack.length - 1].params.all = true; render(); return; }
    if (el.dataset.link) return openLink(el.dataset.link);
    if (el.dataset.mode) { sheetMode = el.dataset.mode; document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === sheetMode))); haptic("light"); return; }
    if (el.dataset.buy) return buy(el.dataset.buy);
    if (el.dataset.add) return addToCart(el.dataset.add);
    if (el.dataset.rm) return removeFromCart(el.dataset.rm);
    if (el.dataset.checkout) return checkout();
    if (el.dataset.restore) return restoreCart();
    if (el.dataset.home) { closeSheet(); stack.length = 1; render(); window.scrollTo(0, 0); return; }
  });
  $("#scrim").addEventListener("click", closeSheet);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") back(); });

  // ---------- falling sakura, smooth, frame-rate independent ----------
  function petals() {
    const cv = $("#petals"), cx = cv.getContext("2d");
    let w, h, dpr, list = [], sprites = [], last = 0;
    const makeSprite = (size, c1, c2) => {
      const s = document.createElement("canvas"); s.width = s.height = size; const g = s.getContext("2d");
      g.translate(size / 2, size / 2);
      const r = size * 0.46;
      const grad = g.createLinearGradient(0, -r, 0, r); grad.addColorStop(0, c1); grad.addColorStop(1, c2);
      g.fillStyle = grad;
      g.beginPath();
      g.moveTo(0, r);
      g.bezierCurveTo(-r * 0.95, r * 0.25, -r * 0.7, -r * 0.85, -r * 0.16, -r * 0.92);
      g.lineTo(0, -r * 0.62);
      g.lineTo(r * 0.16, -r * 0.92);
      g.bezierCurveTo(r * 0.7, -r * 0.85, r * 0.95, r * 0.25, 0, r);
      g.fill();
      g.globalAlpha = 0.35; g.strokeStyle = "#fff"; g.lineWidth = size * 0.02;
      g.beginPath(); g.moveTo(0, r * 0.85); g.quadraticCurveTo(r * 0.05, 0, 0, -r * 0.55); g.stroke();
      return s;
    };
    const spawn = (anywhere) => {
      const depth = Math.random();
      return {
        x: Math.random() * w, y: anywhere ? Math.random() * h : -40 * dpr,
        size: (9 + depth * 13) * dpr,
        vy: (16 + depth * 28) * dpr,           // px per second
        drift: (Math.random() - 0.5) * 18 * dpr,
        sway: Math.random() * Math.PI * 2, swaySpeed: 0.6 + Math.random() * 0.9, swayAmp: (14 + Math.random() * 26) * dpr,
        rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 1.6,
        flip: Math.random() * Math.PI * 2, vflip: 1.2 + Math.random() * 2.2,
        alpha: 0.22 + depth * 0.4, sprite: sprites[(Math.random() * sprites.length) | 0],
      };
    };
    const resize = () => {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = cv.width = Math.floor(innerWidth * dpr); h = cv.height = Math.floor(innerHeight * dpr);
      sprites = [makeSprite(64, "#ffd6e1", "#ff8fab"), makeSprite(64, "#ffc2d1", "#ff6f91"), makeSprite(64, "#fff0f4", "#ffb8cb")];
      const count = Math.round(Math.min(14, Math.max(8, innerWidth / 30)));
      list = Array.from({ length: count }, () => spawn(true));
    };
    const draw = (p, dt) => {
      p.y += p.vy * dt; p.sway += p.swaySpeed * dt; p.rot += p.vr * dt; p.flip += p.vflip * dt;
      const x = p.x + Math.sin(p.sway) * p.swayAmp + p.drift * (p.y / h);
      if (p.y > h + 40 * dpr) Object.assign(p, spawn(false));
      cx.save();
      cx.globalAlpha = p.alpha;
      cx.translate(x, p.y);
      cx.rotate(p.rot);
      cx.scale(Math.max(0.15, Math.abs(Math.cos(p.flip))), 1);
      cx.drawImage(p.sprite, -p.size / 2, -p.size / 2, p.size, p.size);
      cx.restore();
    };
    const frame = (ts) => {
      const dt = last ? Math.min((ts - last) / 1000, 0.05) : 0.016;
      last = ts;
      cx.clearRect(0, 0, w, h);
      for (const p of list) draw(p, dt);
      raf2 = requestAnimationFrame(frame);
    };
    let raf2 = 0;
    resize();
    addEventListener("resize", resize);
    if (reduceMotion) { list.forEach((p) => draw(p, 0)); return; }
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) { cancelAnimationFrame(raf2); raf2 = 0; }
      else if (!raf2) { last = 0; raf2 = requestAnimationFrame(frame); }
    });
    raf2 = requestAnimationFrame(frame);
  }

  // ---------- start ----------
  async function start() {
    if (inTelegram) {
      tg.ready(); tg.expand();
      try { tg.setHeaderColor("#1a060c"); tg.setBackgroundColor("#1a060c"); } catch {}
      tg.BackButton.onClick(back);
      if (tg.MainButton) tg.MainButton.onClick(() => { if (stack[stack.length - 1].screen === "cart") checkout(); });
    }
    // Пока каталог грузится — спокойная заставка вместо пустого экрана.
    $("#view").innerHTML = `<div class="splash" role="status" aria-busy="true" aria-label="${esc(t("loading"))}">
      <img class="splash3d" src="wm3d.webp" alt="" width="480" height="186" decoding="async">
      <div class="splash-bar" aria-hidden="true"><span></span></div>
      <p class="splash-text">${esc(t("loading"))}</p></div>`;
    const splashStart = Date.now();
    // Каталог: две попытки. Не загрузился — честно говорим покупателю, а не показываем молча запасной.
    let loaded = false;
    for (let attempt = 0; attempt < 2 && !loaded; attempt++) {
      if (attempt) await new Promise((r) => setTimeout(r, 1500));
      try {
        const res = await fetch("catalog.json", { cache: "no-cache" });
        if (res.ok) { const data = await res.json(); if (data && Array.isArray(data.items)) { catalog = data; personalize(); loaded = true; } }
      } catch { /* сеть недоступна */ }
    }
    // Заставка держится минимум ~2,6 с, чтобы 3D-надпись успели увидеть.
    // Настройки (звёзды, бонус, 2D) приходят отдельным запросом. Ждём их, чтобы не мигал старый экран.
    // Не дольше 4 с: если сервер медленный, покажем каталог без них.
    const settled = Promise.race([loadFeatures() || Promise.resolve(), new Promise((r) => setTimeout(r, 4000))]);
    const wait = 2600 - (Date.now() - splashStart);
    await Promise.all([settled, wait > 0 ? new Promise((r) => setTimeout(r, wait)) : null]);
    splashing = false;
    petals();
    render();
    if (!loaded && location.protocol !== "file:") toast(t("noCatalog"));
  }
  start();
})();
